<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📈 Live Market Signals</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />

    <!-- Socket.IO Client -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>

<div class="container">
    <div class="header-container">
        <h1>📈 Live Market Signals</h1>
        <button onclick="refreshData()" id="refreshBtn" class="refresh-btn">🔄 Refresh</button>
    </div>
    <div class="status" id="status">🔌 Connecting to WebSocket…</div>

    <table>
        <thead>
            <tr>
                <th>Symbol</th>
                <th>Price</th>
                <th>Change</th>
                <th>Sentiment</th>
                <th>Signal</th>
                <th>Confidence</th>
                <th>Reason</th>
                <th>AI Explanation</th>
            </tr>
        </thead>
        <tbody id="signals-body">
            <tr><td colspan="8" class="loading">Loading signals...</td></tr>
        </tbody>
    </table>
</div>

<!-- External JavaScript -->
<script src="app.js"></script>

</body>
</html>
